version: "3.8"

services:
  web:
    build: ./app
    container_name: ramigame_web
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ramigame_db:/usr/src/app/db
    expose:
      - "3000"
    ports:
      # En LOCAL uniquement : accès direct http://localhost:3000
      # En PRODUCTION avec nginx : vous pouvez commenter cette ligne
      # car nginx fera le proxy vers le port interne 3000.
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: ramigame_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt

  certbot:
    image: certbot/certbot
    container_name: ramigame_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  ramigame_db:
  certbot_www:
  certbot_conf:
