# Configuration Nginx - reverse proxy vers l'app Node (RAMIGame)
# Domaine : RamiGame.gr.com

server {
    listen 80;
    server_name RamiGame.gr.com www.RamiGame.gr.com;

    # Nécessaire pour la validation Let's Encrypt (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Avant d'avoir un certificat SSL, laissez cette ligne en commentaire.
    # Une fois le certificat obtenu (voir README), décommentez pour forcer HTTPS :
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

